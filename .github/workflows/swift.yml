name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Test with coverage
        run: swift test --enable-code-coverage
      - name: Coverage summary and gate
        run: python3 scripts/coverage_summary.py --minimum 85

  linux:
    name: test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:latest

    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and Python
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev pkg-config python3
      - name: Build
        run: swift build --build-tests
      - name: Test with coverage
        run: swift test --enable-code-coverage
      - name: Coverage summary and gate
        run: python3 scripts/coverage_summary.py --minimum 85

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:latest

    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and Python
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev pkg-config python3
      - name: Build DocC catalog
        run: python3 scripts/check_documentation.py
